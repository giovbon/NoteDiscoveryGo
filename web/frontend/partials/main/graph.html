            <!-- Graph View Overlay (works from homepage or editor) -->
            <div 
                x-data="graphPanel"
                x-show="showGraph"
                id="graph-overlay"
                class="absolute inset-0"
                style="background-color: var(--bg-primary); z-index: 50;"
            >
                <!-- Graph renders here via vis-network -->
                <div x-show="!graphLoaded" class="flex items-center justify-center h-full">
                    <div class="text-center" style="color: var(--text-secondary);">
                        <svg class="animate-spin h-8 w-8 mx-auto mb-3" style="color: var(--accent-primary);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p x-text="t('graph.loading')"></p>
                    </div>
                </div>
                <!-- Empty vault / nothing matched the folder filter -->
                <div x-show="graphLoaded && graphEmpty" class="flex items-center justify-center h-full pointer-events-none">
                    <div class="text-center pointer-events-auto" style="color: var(--text-secondary);">
                        <svg class="mx-auto h-12 w-12 mb-3" style="color: var(--text-tertiary); opacity: 0.5;" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 005.656 5.656l-1.1 1.1"></path>
                        </svg>
                        <p x-text="t('graph.empty')"></p>
                    </div>
                </div>
                <!-- Load failure: message + retry instead of an endless spinner -->
                <div x-show="graphLoaded && graphError" class="flex items-center justify-center h-full pointer-events-none">
                    <div class="text-center pointer-events-auto" style="color: var(--text-secondary);">
                        <svg class="mx-auto h-12 w-12 mb-3" style="color: var(--text-tertiary); opacity: 0.6;" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <p class="mb-4" x-text="graphError"></p>
                        <button
                            @click="initGraph()"
                            class="px-4 py-2 text-sm font-medium rounded-lg transition-colors"
                            style="background-color: var(--accent-primary); color: white;"
                            onmouseover="this.style.backgroundColor='var(--accent-hover)'"
                            onmouseout="this.style.backgroundColor='var(--accent-primary)'"
                        >
                            <span x-text="t('graph.retry')"></span>
                        </button>
                    </div>
                </div>
                <!-- Close button -->
                <button 
                    @click="showGraph = false"
                    class="absolute top-4 left-4 px-3 py-2 text-sm font-medium rounded-lg transition-colors z-10"
                    style="background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-primary);"
                    onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                    onmouseout="this.style.backgroundColor='var(--bg-secondary)'"
                >
                    ← Back
                </button>
            </div>
