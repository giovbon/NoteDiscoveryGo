    <!-- Contextual New Item Dropdown -->
    <div 
        x-data="newItemModal"
        x-show="showNewDropdown"
        @click.outside="closeDropdown()"
        x-transition:enter="transition ease-out duration-100"
        x-transition:enter-start="transform opacity-0 scale-95"
        x-transition:enter-end="transform opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-75"
        x-transition:leave-start="transform opacity-100 scale-100"
        x-transition:leave-end="transform opacity-0 scale-95"
        class="rounded-lg shadow-lg overflow-hidden"
        :style="`position: fixed; top: ${dropdownPosition.top}px; left: ${dropdownPosition.left}px; z-index: 1000; background-color: var(--bg-secondary); border: 1px solid var(--border-primary); min-width: 184px;`"
        x-cloak
    >
        <div class="py-1">
            <button 
                data-testid="new-note"
                @click="createNote()"
                class="w-full px-3 py-2 text-sm text-left flex items-center gap-2.5 transition-colors"
                style="color: var(--text-primary);"
                onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                onmouseout="this.style.backgroundColor='transparent'"
            >
                <svg class="w-4 h-4 flex-shrink-0" style="color: var(--tree-note);" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2v6h6M16 13H8M16 17H8"></path>
                </svg>
                <span x-text="t('sidebar.new_note')"></span>
            </button>
            <button 
                @click="createFolder()"
                class="w-full px-3 py-2 text-sm text-left flex items-center gap-2.5 transition-colors"
                style="color: var(--text-primary);"
                onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                onmouseout="this.style.backgroundColor='transparent'"
            >
                <svg class="w-4 h-4 flex-shrink-0" style="color: var(--tree-folder);" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <span x-text="t('sidebar.new_folder')"></span>
            </button>
        </div>
    </div>
