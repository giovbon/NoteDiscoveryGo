    <!-- New note / folder name (replaces window.prompt) -->
    <div x-data="newNoteModal"
         x-show="showCreateNameModal"
         @click.self="cancelCreateNameModal()"
         @keydown.escape.window="showCreateNameModal && cancelCreateNameModal()"
         class="fixed inset-0 flex items-center justify-center p-4"
         style="background-color: rgba(0, 0, 0, 0.5); z-index: 1100;"
         x-cloak>
        <div class="rounded-xl shadow-xl w-full max-w-sm overflow-hidden"
             style="background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-primary);"
             @click.stop
             role="dialog"
             aria-modal="true"
             aria-labelledby="create-name-modal-title">
            <div class="flex items-start gap-3 p-4">
                <span class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                      style="background-color: var(--accent-light, rgba(59, 130, 246, 0.14)); color: var(--accent-primary);"
                      aria-hidden="true">
                    <svg x-show="createNameModalKind === 'note'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2v6h6M16 13H8M16 17H8"></path>
                    </svg>
                    <svg x-show="createNameModalKind === 'folder'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    </svg>
                </span>
                <div class="min-w-0 flex-1">
                    <h2 id="create-name-modal-title" class="text-base font-semibold leading-6" style="color: var(--text-primary);" x-text="createNameModalTitle()"></h2>
                    <p x-show="createNameModalHelpText().trim()" class="text-xs mt-0.5 leading-5 whitespace-pre-line" style="color: var(--text-secondary);" x-text="createNameModalHelpText()"></p>
                </div>
                <button
                    type="button"
                    @click="cancelCreateNameModal()"
                    class="-m-1 p-1 rounded transition-colors"
                    style="color: var(--text-tertiary);"
                    onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                    onmouseout="this.style.backgroundColor='transparent'"
                    :title="t('common.cancel')"
                    :aria-label="t('common.cancel')"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="px-4 pb-4">
                <label for="create-name-modal-input" class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);" x-text="createNameModalLabel()"></label>
                <input
                    id="create-name-modal-input"
                    type="text"
                    x-model="createNameModalInput"
                    :placeholder="createNameModalKind === 'folder' ? t('folders.input_placeholder') : t('notes.input_placeholder')"
                    class="w-full px-3 py-2 text-sm rounded-md border outline-none"
                    style="background-color: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-primary);"
                    @focus="$el.style.borderColor='var(--accent-primary)'"
                    @blur="$el.style.borderColor='var(--border-primary)'"
                    @keydown.enter="submitCreateNameModal()"
                    autocomplete="off"
                />
            </div>
            <div class="flex items-center justify-end gap-2 px-4 py-3" style="background-color: var(--bg-tertiary); border-top: 1px solid var(--border-primary);">
                <button
                    type="button"
                    @click="cancelCreateNameModal()"
                    class="px-3 py-1.5 text-sm rounded-md font-medium transition-colors"
                    style="color: var(--text-primary);"
                    onmouseover="this.style.backgroundColor='var(--bg-hover)'"
                    onmouseout="this.style.backgroundColor='transparent'"
                    x-text="t('common.cancel')"
                ></button>
                <button
                    type="button"
                    data-testid="create-submit"
                    @click="submitCreateNameModal()"
                    class="px-3 py-1.5 text-sm rounded-md font-medium text-white transition-colors"
                    style="background-color: var(--accent-primary);"
                    onmouseover="this.style.backgroundColor='var(--accent-hover)'"
                    onmouseout="this.style.backgroundColor='var(--accent-primary)'"
                    x-text="t('common.create')"
                ></button>
            </div>
        </div>
    </div>
